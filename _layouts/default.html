<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  {% include seo-head.html %}

  <!-- Bootstrap CSS — hébergé localement -->
  <link rel="stylesheet" href="{{ '/assets/css/bootstrap.min.css' | relative_url }}">

  <!-- Google Fonts — chargement asynchrone (ne bloque plus le rendu) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Cormorant+Garant:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@300;400;500&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Cormorant+Garant:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  </noscript>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}" />
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}" />

  {% include analytics.html %}
</head>

<body>

  <a href="#main-content" class="skip-link">Aller au contenu principal</a>

  {% include navbar.html %}

  <main id="main-content">
    {{ content }}
  </main>

  {% include footer.html %}

  <!-- Bootstrap JS — hébergé localement -->
  <script src="{{ '/assets/js/bootstrap.bundle.min.js' | relative_url }}"></script>

  <!-- GSAP + ScrollTrigger -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

  <script>
    // ============================================================
    // Accessibilité : répliquer les effets hover lors du focus clavier
    // Les cartes et liens ont des onmouseover/onmouseout sur leurs
    // enfants — on les déclenche aussi au focus/blur sur le lien parent
    // ============================================================
    (function() {
      // Cartes dans des liens <a> (onmouseover sur un enfant)
      document.querySelectorAll('a[href]').forEach(function(link) {
        var card = link.querySelector('[onmouseover]');
        if (!card) return;
        link.addEventListener('focus', function() {
          card.dispatchEvent(new MouseEvent('mouseover', { bubbles: true }));
        });
        link.addEventListener('blur', function() {
          card.dispatchEvent(new MouseEvent('mouseout', { bubbles: true }));
        });
      });
      // Liens <a> qui ont eux-mêmes onmouseover (ex: liste d'épisodes)
      document.querySelectorAll('a[onmouseover]').forEach(function(link) {
        link.addEventListener('focus', function() {
          link.dispatchEvent(new MouseEvent('mouseover', { bubbles: false }));
        });
        link.addEventListener('blur', function() {
          link.dispatchEvent(new MouseEvent('mouseout', { bubbles: false }));
        });
      });
      // <summary> dans <details> (FAQ)
      document.querySelectorAll('summary[onmouseover]').forEach(function(summary) {
        summary.addEventListener('focus', function() {
          summary.dispatchEvent(new MouseEvent('mouseover', { bubbles: true }));
        });
        summary.addEventListener('blur', function() {
          summary.dispatchEvent(new MouseEvent('mouseout', { bubbles: true }));
        });
      });
    })();

    gsap.registerPlugin(ScrollTrigger);

    // Animations uniquement sur desktop et si l'utilisateur n'a pas demandé
    // la réduction des mouvements (prefers-reduced-motion — RGAA critère 13.8)
    var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (window.innerWidth >= 768 && !prefersReduced) {
      requestAnimationFrame(function() {
        document.querySelectorAll('section').forEach((section, i) => {
          // Hero already visible — animate inner elements instead
          if (i === 0) {
            gsap.from(section.querySelectorAll('.kicker, h1, .hero-subtitle, .d-flex'), {
              opacity: 0,
              y: 28,
              duration: 0.75,
              stagger: 0.12,
              ease: 'power2.out',
              delay: 0.1
            });
            return;
          }
          gsap.from(section, {
            opacity: 0,
            y: 48,
            duration: 0.85,
            ease: 'power2.out',
            scrollTrigger: {
              trigger: section,
              start: 'top 84%',
              toggleActions: 'play none none none'
            }
          });
        });
      });
    }
  </script>

</body>
</html>
